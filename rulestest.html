<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rules test</title>
<style>body{font-family:system-ui,sans-serif;background:#1a1040;color:#fff;margin:0;padding:20px;max-width:480px;margin:auto}
button{width:100%;padding:16px;font-size:17px;font-weight:700;border:0;border-radius:12px;background:#80d8ff;color:#1e1248;margin:12px 0}
.r{padding:12px 14px;border-radius:10px;margin:8px 0;font-size:15px}.ok{background:#1d5c2e}.bad{background:#7a1f1f}.info{background:#2a2060}</style></head><body>
<h2>Security test</h2>
<p>Runs 3 checks with no sign-in, the way a stranger would.</p>
<button id="go">Run test</button><div id="out"></div>
<script>
const U='https://taxi-queue-3e591-default-rtdb.firebaseio.com';
const out=document.getElementById('out');
function add(cls,t){const d=document.createElement('div');d.className='r '+cls;d.textContent=t;out.appendChild(d);}
async function code(path,method,body){try{const r=await fetch(U+path,{method,body});return r.status;}catch(e){return 'error';}}
document.getElementById('go').onclick=async()=>{
  out.innerHTML='';
  const rd=await code('/queue.json','GET');
  add(rd===200?'ok':'bad','1. Stranger READS the queue: '+rd+(rd===200?' (expected: drivers need this)':' (unexpected: drivers could not see the queue)'));
  const wr=await code('/securitytest.json','PUT','"x"');
  if(wr===200){await code('/securitytest.json','DELETE');}
  add(wr===401||wr===403?'ok':'bad','2. Stranger WRITES a random spot: '+wr+(wr===401||wr===403?' (blocked, good)':' (NOT BLOCKED, rules are not working)'));
  const wq=await code('/maxNum.json','PUT','"notanumber"');
  add(wq===401||wq===403?'ok':'bad','3. Stranger changes the highest taxi number: '+wq+(wq===401||wq===403?' (blocked, good)':' (NOT BLOCKED, rules are not working)'));
  add('info','Good result: 1 is 200, 2 and 3 are 401 or 403.');
};
</script></body></html>
