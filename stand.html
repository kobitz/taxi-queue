<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest-stand.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2d1b69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Stand">
<title>Taxi Stand Queue</title>
<style>
  :root {
    --bg: #2d1b69;
    --stand: #1565c0;
    --holding: #6a1b9a;
    --highlight: #80d8ff;
    --loading: #ffd600;
    --overflow: rgba(128,216,255,.12);
    --empty: rgba(255,255,255,0.07);
    --tile: 60px;
    --gap: 4px;
    --r: 6px;
    --label-w: 26px;
    --pad: 10px;
    --grphdr-h: 18px;
    --colhdr-h: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  html, body { overflow-x: hidden; max-width: 100vw; touch-action: manipulation; }
  body { background: var(--bg); min-height: 100dvh; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; padding: var(--pad); }

  h2 { font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--highlight); margin-bottom: 8px; opacity: 0.75; }
  .divider { height: 1px; background: linear-gradient(90deg,transparent,rgba(128,216,255,.3),transparent); margin: 14px 0; }

  /* sync indicator */
  #sync-status {
    position: fixed; top: 16px; right: 130px;
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    padding: 3px 8px; border-radius: 20px;
    opacity: 0.85; transition: background .3s, opacity .3s;
    pointer-events: none; z-index: 100;
  }
  #sync-status.ok      { background: rgba(0,200,100,.25); color: #69ffb0; }
  #sync-status.saving  { background: rgba(255,214,0,.25);  color: #ffd600; }
  #sync-status.error   { background: rgba(255,80,80,.25);  color: #ff8080; }

  /* QUEUE LAYOUT */
  #queue-wrapper { display: flex; flex-direction: row; gap: var(--gap); }
  #row-labels {
    display: flex; flex-direction: column; gap: var(--gap);
    margin-top: calc(var(--grphdr-h) + var(--gap) + var(--colhdr-h) + var(--gap));
    flex-shrink: 0;
  }
  .row-label {
    width: var(--label-w); height: var(--tile);
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 4px; font-size: 10px; font-weight: 700;
    color: rgba(128,216,255,.6); letter-spacing: .5px; flex-shrink: 0;
  }
  #queue-cols { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
  #group-headers { display: flex; flex-direction: row; gap: var(--gap); height: var(--grphdr-h); }
  .grp-spacer { flex-shrink: 0; }
  .grp-label {
    height: var(--grphdr-h);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 800; letter-spacing: 1.5px;
    text-transform: uppercase; border-radius: 3px; flex-shrink: 0;
  }
  .grp-stand   { background: rgba(21,101,192,.35);  color: #80d8ff; }
  .grp-holding { background: rgba(106,27,154,.35);  color: #ce93d8; }
  .col-headers { display: flex; flex-direction: row; gap: var(--gap); height: var(--colhdr-h); }
  .col-header {
    width: var(--tile); height: var(--colhdr-h);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: rgba(128,216,255,.55);
    letter-spacing: .5px; flex-shrink: 0;
  }
  #queue-grid { display: flex; flex-direction: column; gap: var(--gap); }
  .qrow { display: flex; flex-direction: row; gap: var(--gap); }
  .qrow.new-row { animation: rowIn .22s cubic-bezier(.34,1.56,.64,1); }
  @keyframes rowIn { from { opacity:0; transform:translateY(-10px) scale(.96); } to { opacity:1; transform:none; } }

  /* TILE */
  .tile {
    width: var(--tile); height: var(--tile);
    border-radius: var(--r);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--tile) * 0.28); font-weight: 700;
    position: relative;
    transition: transform .15s, box-shadow .15s, opacity .15s, margin-left .15s, margin-right .15s;
    flex-shrink: 0; cursor: grab;
  }
  .tile:active { cursor: grabbing; }
  .tile.dragging   { opacity: .25; transform: scale(.88); }
  .tile.drag-ready { transform: scale(1.05); box-shadow: 0 0 0 2px var(--highlight); transition: transform .15s, box-shadow .15s; }
  .tile.drop-ok  { box-shadow: 0 0 0 3px var(--highlight); transform: scale(1.07); }
  .tile.selected  { box-shadow: 0 0 0 2px var(--highlight); filter: brightness(1.35); }
  .tile.landmark  { filter: brightness(1.5) saturate(1.4); background: rgba(128,216,255,.20); }

  .tile .sub { position:absolute; bottom:3px; right:5px; font-size:calc(var(--tile)*0.11); font-weight:400; opacity:.5; }
  .tile.selected::before { content:'Drop?'; position:absolute; top:4px; left:0; right:0; text-align:center; font-size:calc(var(--tile)*0.18); font-weight:600; opacity:.7; pointer-events:none; }

  .q-zero     { background: rgba(180,180,180,.15); border: 1.5px solid rgba(255,255,255,.18); color: rgba(255,255,255,.5); box-shadow: none; cursor: pointer; }
  .q-zero.primed        { box-shadow: 0 0 0 2px #ffd600; color: #ffd600; }
  .q-zero.clear-armed   { background: #d32f2f; border-color: #ff8a80; box-shadow: 0 0 0 2px #ff5555; color: #fff; }
  .q-zero.clear-confirm { box-shadow: 0 0 0 2px #ff5555; color: #ff5555; }
  .tile.load-target { box-shadow: 0 0 0 2px #ffd600 !important; filter: brightness(1.2); }
  .q-stand    { background: var(--stand);    box-shadow: 0 4px 14px rgba(21,101,192,.45); }
  .q-hold     { background: var(--holding);  box-shadow: 0 4px 14px rgba(106,27,154,.45); }
  .q-overflow { background: var(--overflow); border: 1.5px solid rgba(128,216,255,.22); color: rgba(255,255,255,.85); }
  .q-empty    { background: var(--empty); border: 1.5px dashed rgba(255,255,255,.13); cursor: default !important; }
  .q-empty.hidden-slot { visibility: hidden; pointer-events: none; }
  .q-add { background: var(--empty); border: 1.5px dashed rgba(128,216,255,.35);
    color: rgba(128,216,255,.5); font-size: calc(var(--tile)*0.45);
    cursor: pointer; line-height: 1; }
  .q-add:hover { background: rgba(128,216,255,.08); border-color: rgba(128,216,255,.6); color: rgba(128,216,255,.8); }


  .qhead { display:flex; align-items:center; gap:12px; margin-bottom:8px; }
  .qhead h2 { margin:0; }
  #undo-btn { font-size:12px; font-weight:700; letter-spacing:.5px; padding:6px 12px; border-radius:10px; min-height:32px;
    background:rgba(255,171,64,.15); color:#ffab40; border:1.5px solid rgba(255,171,64,.4); cursor:pointer; }
  #undo-btn:active { background:rgba(255,171,64,.35); }
  #undo-btn:disabled { opacity:.3; pointer-events:none; }

  /* TABS + DIAL PAD */
  .tabs { display:flex; gap:18px; margin-bottom:8px; }
  .tabs h2 { margin:0; cursor:pointer; padding:6px 0 4px; border-bottom:2px solid transparent; opacity:.4; }
  .tabs h2.active { opacity:.9; border-bottom-color:var(--highlight); }
  #pad-panel { display:none; max-width:320px; }
  #pad-display { height:56px; border-radius:var(--r); background:var(--empty); border:1.5px solid rgba(128,216,255,.3);
    display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700; margin-bottom:var(--gap); letter-spacing:2px; }
  #pad-display.err { color:#ff8080; font-size:15px; letter-spacing:0; text-align:center; padding:0 6px; }
  #pad-display small { font-size:11px; opacity:.6; margin-left:8px; letter-spacing:1px; }
  #pad-keys { display:grid; grid-template-columns:repeat(3,1fr); gap:var(--gap); }
  .pad-key { height:58px; border-radius:var(--r); background:rgba(128,216,255,.12); border:1.5px solid rgba(128,216,255,.22);
    color:#fff; font-size:24px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .pad-key:active { background:rgba(128,216,255,.35); }
  .pad-key.fn { font-size:18px; color:var(--highlight); }
  .pad-key.filler, .pad-key.fn.filler { font-size:13px; background:rgba(180,180,180,.15); color:rgba(255,255,255,.7); border-color:rgba(255,255,255,.18); line-height:1.15; text-align:center; }
  .tile.replace-target { box-shadow: 0 0 0 3px #ffd600 !important; }
  .pad-key.dim { opacity:.3; pointer-events:none; }
  .pad-key.go { font-size:15px; background:var(--stand); border-color:transparent; }
  .pad-key.go:active { filter:brightness(1.3); }

  /* POOL */
  #pool-grid { display: grid; grid-template-columns: repeat(10, var(--tile)); gap: var(--gap); }
  .tile.pool { background: rgba(128,216,255,.12); border: 1.5px solid rgba(128,216,255,.22); color: rgba(255,255,255,.85); }

  /* GHOST */
  #ghost {
    position: fixed; pointer-events: none; z-index: 9999;
    border-radius: var(--r); display: none;
    align-items: center; justify-content: center; font-weight: 700;
    width: var(--tile); height: var(--tile);
    font-size: calc(var(--tile) * 0.28);
    opacity: .92; box-shadow: 0 10px 30px rgba(0,0,0,.65);
  }

  #zoom-btn {
    position: fixed; top: 6px; right: 6px;
    font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
    padding: 10px 14px; border-radius: 12px; min-width: 44px; min-height: 44px;
    background: rgba(128,216,255,.15); color: #80d8ff;
    border: 1.5px solid rgba(128,216,255,.3);
    cursor: pointer; z-index: 100;
    transition: background .2s;
    line-height: 1;
  }
  #zoom-btn:hover { background: rgba(128,216,255,.28); }
  #zoom-btn.active { background: rgba(128,216,255,.3); color: #fff; }

  /* name modal — uses the phone's normal keyboard */
  #name-modal { display:none; position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.7); align-items:center; justify-content:center; }
  #name-modal.visible { display:flex; }
  .name-card { background:#1e1248; border:1.5px solid rgba(128,216,255,.45); border-radius:16px; padding:18px 14px; width:min(96%,380px); text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.6); }
  .name-title { font-size:11px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:#80d8ff; margin-bottom:6px; }
  .name-sub { font-size:13px; opacity:.7; margin-bottom:14px; }
  #name-display { min-height:52px; border-radius:10px; border:1.5px solid rgba(128,216,255,.4); background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:700; padding:0 10px; word-break:break-all; }
  #name-display.empty { font-size:15px; font-weight:400; opacity:.5; }
  #name-keys { margin-top:10px; display:flex; flex-direction:column; gap:5px; }
  .nk-row { display:flex; gap:4px; justify-content:center; }
  .nk { flex:1 1 0; max-width:36px; height:42px; border-radius:7px; background:rgba(128,216,255,.12); border:1.5px solid rgba(128,216,255,.22); color:#fff; font-size:17px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .nk:active { background:rgba(128,216,255,.35); }
  .nk.wide { max-width:56px; flex:1.5 1 0; font-size:14px; color:#80d8ff; }
  .nk.space { max-width:none; flex:6 1 0; font-size:13px; color:#80d8ff; }
  .nk.on { background:#80d8ff; color:#1e1248; }
  .name-btns { display:flex; gap:10px; margin-top:14px; justify-content:center; }
  .name-btn { padding:11px 26px; border-radius:10px; font-size:14px; font-weight:700; border:none; cursor:pointer; }
  .name-save { background:#80d8ff; color:#1e1248; }
  .name-skip { background:rgba(255,255,255,.1); color:rgba(255,255,255,.7); border:1.5px solid rgba(255,255,255,.2); }

  /* 10-11 modal */
  #req1011-modal {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: rgba(0,0,0,.65); align-items: center; justify-content: center;
  }
  #req1011-modal.visible { display: flex; }
  .req1011-card {
    background: #1e1248; border: 1.5px solid rgba(255,214,0,.45);
    border-radius: 16px; padding: 28px 24px; max-width: 300px; width: 90%;
    text-align: center; box-shadow: 0 12px 40px rgba(0,0,0,.6);
  }
  .req1011-title { font-size: 11px; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; color: #ffd600; margin-bottom: 10px; }
  .req1011-msg   { font-size: 17px; font-weight: 700; margin-bottom: 22px; line-height: 1.3; }
  .req1011-btns  { display: flex; gap: 10px; justify-content: center; }
  .req1011-btn   { padding: 11px 28px; border-radius: 10px; font-size: 14px; font-weight: 700; border: none; cursor: pointer; }
  .req1011-ok    { background: #ffd600; color: #1e1248; }
  .req1011-undo  { background: rgba(255,255,255,.1); color: rgba(255,255,255,.7); border: 1.5px solid rgba(255,255,255,.2); }
</style>
</head>
<body>

<button id="zoom-btn">Bigger Tiles</button>

<div id="sync-status" class="ok">LIVE</div>

<section>
  <div class="qhead"><h2>Queue</h2><button id="undo-btn" disabled>↶ Undo</button></div>
  <div id="queue-wrapper">
    <div id="row-labels"></div>
    <div id="queue-cols">
      <div id="group-headers"></div>
      <div class="col-headers" id="col-headers"></div>
      <div id="queue-grid"></div>
    </div>
  </div>
</section>

<div class="divider"></div>

<section>
  <div class="tabs"><h2 id="tab-nq" class="active">Not in Queue</h2><h2 id="tab-pad">Dial Pad</h2></div>
  <div id="pool-grid"></div>
  <div id="pad-panel">
    <div id="pad-display">_</div>
    <div id="pad-keys"></div>
  </div>

</section>

<div id="name-modal">
  <div class="name-card">
    <div class="name-title">Your name</div>
    <div class="name-sub">Shown next to your changes in History</div>
    <div id="name-display" class="empty">Type your name</div>
    <div id="name-keys"></div>
    <div class="name-btns">
      <button class="name-btn name-save" id="name-save">Save</button>
      <button class="name-btn name-skip" id="name-skip">Skip</button>
    </div>
  </div>
</div>

<div id="req1011-modal">
  <div class="req1011-card">
    <div class="req1011-title">10-11 Request</div>
    <div class="req1011-msg" id="req1011-msg"></div>
    <div class="req1011-btns">
      <button class="req1011-btn req1011-ok"   id="req1011-ok">OK</button>
      <button class="req1011-btn req1011-undo" id="req1011-undo">Undo</button>
    </div>
  </div>
</div>

<div id="ghost"></div>

<script type="module">
import { initializeApp }         from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue, set, push } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

/* ── FIREBASE ── */
const app = initializeApp({
  apiKey: "AIzaSyPlaceholderNotNeededForRTDB",
  databaseURL: "https://taxi-queue-3e591-default-rtdb.firebaseio.com"
});
const db       = getDatabase(app);
const queueRef = ref(db, 'queue');
const historyRef = ref(db, 'history');
const maxRef          = ref(db, 'maxNum');
const request1011Ref  = ref(db, 'request1011');

const syncEl = document.getElementById('sync-status');
function setSync(state) {
  syncEl.className = state;
  syncEl.textContent = state === 'ok' ? 'LIVE' : state === 'saving' ? 'SAVING…' : 'OFFLINE';
}


/* ── DEVICE NAME ── */
function getOSType() {
  const ua = navigator.userAgent;
  if (/iPhone/.test(ua))    return 'iPhone';
  if (/iPad/.test(ua))      return 'iPad';
  if (/Android/.test(ua))   return 'Android';
  if (/Windows/.test(ua))   return 'Windows';
  if (/Macintosh/.test(ua)) return 'Mac';
  if (/Linux/.test(ua))     return 'Linux';
  return 'Unknown';
}

let userName = localStorage.getItem('taxi-device-name') || '';

/* In-page name box with its own on-screen keyboard (window.prompt and the iPhone keyboard were both unreliable
   in the installed app). History entries made before a name is entered are held and sent once it is. */
const nameModal = document.getElementById('name-modal');
const nameDisplay = document.getElementById('name-display');
let pendingLogs = [];
let nameValue = '', nameShift = true;   // shift starts on so the first letter is capitalised
const NAME_MAX = 20;
function nameRender() {
  nameDisplay.textContent = nameValue || 'Type your name';
  nameDisplay.classList.toggle('empty', !nameValue);
  document.querySelectorAll('#name-keys .nk').forEach(k => {
    if (k.dataset.k === 'shift') k.classList.toggle('on', nameShift);
    else if (/^[a-z]$/i.test(k.dataset.k)) k.textContent = nameShift ? k.dataset.k.toUpperCase() : k.dataset.k.toLowerCase();
  });
}
function showNameModal() {
  if (nameModal.classList.contains('visible')) return;
  nameValue = ''; nameShift = true; nameRender();
  nameModal.classList.add('visible');
}
function finishName(skip) {
  userName = skip ? 'Unknown' : (nameValue.trim() || 'Unknown');
  if (!skip && userName !== 'Unknown') localStorage.setItem('taxi-device-name', userName);
  nameModal.classList.remove('visible');
  const logs = pendingLogs; pendingLogs = [];
  logs.forEach(l => push(historyRef, { action: l.action, value: l.value, device: getFullDeviceLabel(), ts: l.ts }));
}
function namePress(k) {
  if (k === 'shift') { nameShift = !nameShift; nameRender(); return; }
  if (k === 'back') { nameValue = nameValue.slice(0, -1); if (!nameValue) nameShift = true; }
  else if (nameValue.length < NAME_MAX) {
    const ch = k === 'space' ? ' ' : (/^[a-z]$/i.test(k) ? (nameShift ? k.toUpperCase() : k.toLowerCase()) : k);
    nameValue += ch;
    nameShift = (ch === ' ' || ch === '-');   // capitalise after a space or hyphen, otherwise lower case
  }
  nameRender();
}
[['1','2','3','4','5','6','7','8','9','0'],
 ['q','w','e','r','t','y','u','i','o','p'],
 ['a','s','d','f','g','h','j','k','l'],
 ['shift','z','x','c','v','b','n','m','back'],
 ['-',"'",'space','.']].forEach(row => {
  const r = document.createElement('div'); r.className = 'nk-row';
  row.forEach(k => {
    const b = document.createElement('div');
    b.dataset.k = k;
    b.className = 'nk' + (k === 'shift' || k === 'back' ? ' wide' : k === 'space' ? ' space' : '');
    b.textContent = k === 'shift' ? '⇧' : k === 'back' ? '⌫' : k === 'space' ? 'space' : k;
    // pointerdown, not click: the page's double-tap-zoom guard can swallow a click that follows a recent tap
    b.addEventListener('pointerdown', e => { e.preventDefault(); namePress(k); });
    r.appendChild(b);
  });
  document.getElementById('name-keys').appendChild(r);
});
document.getElementById('name-save').addEventListener('pointerdown', e => { e.preventDefault(); finishName(false); });
document.getElementById('name-skip').addEventListener('pointerdown', e => { e.preventDefault(); finishName(true); });
// physical keyboard (desktop)
document.addEventListener('keydown', e => {
  if (!nameModal.classList.contains('visible') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') finishName(false);
  else if (e.key === 'Backspace') namePress('back');
  else if (e.key === ' ') namePress('space');
  else if (e.key.length === 1 && /[a-z0-9'.\-]/i.test(e.key)) namePress(e.key);
  else return;
  e.preventDefault();
});

function getFullDeviceLabel() {
  return `${userName} — ${getOSType()}`;
}

/* ── LOG CHANGE ── */
function logChange(action, value) {
  if (value === 'Filler') return;
  if (!userName) {
    pendingLogs.push({ action, value: String(value), ts: Date.now() });
    showNameModal();
    return;
  }
  push(historyRef, {
    action,
    value: String(value),
    device: getFullDeviceLabel(),
    ts: Date.now()
  });
}

/* Debounce saves so rapid drags don't spam Firebase */
let saveTimer = null;
function saveToFirebase() {
  setSync('saving');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    set(queueRef, queue.length ? queue : null)
      .then(() => setSync('ok'))
      .catch(() => setSync('error'));
  }, 300);
}

/* ── DYNAMIC TILE SIZING ── */
let COLS = parseInt(localStorage.getItem('taxi-cols') || '10');

function calcTileSize() {
  const pad = 10*2;
  const labelW = 30;
  const gaps = (COLS-1)*4;
  const size = Math.floor((document.documentElement.clientWidth - pad - labelW - gaps) / COLS);
  document.documentElement.style.setProperty('--tile', size + 'px');
}
calcTileSize();
// iOS reports the old width at the moment of rotation, so re-measure again shortly after
function relayout() { calcTileSize(); render(); }
function relayoutSoon() { relayout(); setTimeout(relayout, 120); setTimeout(relayout, 450); }
window.addEventListener('resize', relayoutSoon);
window.addEventListener('orientationchange', relayoutSoon);
if (window.visualViewport) window.visualViewport.addEventListener('resize', relayoutSoon);

const zoomBtn = document.getElementById('zoom-btn');
// Sync button label to saved state on load
zoomBtn.textContent = COLS === 5 ? 'Smaller Tiles' : 'Bigger Tiles';
zoomBtn.classList.toggle('active', COLS === 5);

zoomBtn.addEventListener('click', () => {
  COLS = COLS === 10 ? 5 : 10;
  localStorage.setItem('taxi-cols', COLS);
  zoomBtn.textContent = COLS === 5 ? 'Smaller Tiles' : 'Bigger Tiles';
  zoomBtn.classList.toggle('active', COLS === 5);
  calcTileSize();
  render();
});

/* ── STATE ── */
let MAX_NUM = parseInt(localStorage.getItem('taxi-max-num') || '140');
let queue = [];
let pool  = new Set();
for (let i = 1; i <= MAX_NUM; i++) pool.add(i);
let loadedPrimed = false;
let clearGuardUntil = 0; // blocks taps on 'Clear all?' until the finger that armed it has been released
let clearState = 0; // 0=normal, 1=clear-armed, 2=confirm

/* Rebuild pool from queue */
function rebuildPool(q) {
  pool = new Set();
  for (let i = 1; i <= MAX_NUM; i++) pool.add(i);
  for (const v of q) if (typeof v === 'number') pool.delete(v);
}

/* ── LISTEN for remote changes ── */
onValue(queueRef, snapshot => {
  const data = snapshot.val();
  queue = Array.isArray(data) ? data : (data ? Object.values(data) : []);
  rebuildPool(queue);
  render();
});

onValue(maxRef, snapshot => {
  const val = snapshot.val();
  if (val && typeof val === 'number' && val !== MAX_NUM) {
    MAX_NUM = val;
    localStorage.setItem('taxi-max-num', MAX_NUM);
    rebuildPool(queue);
    render();
  }
});

onValue(request1011Ref, snapshot => {
  const req = snapshot.val();
  if (!req || !req.number) return;
  showReq1011(req.number);
});

const qGrpHdrs   = document.getElementById('group-headers');

/* ── RENDER ── */
function render() { renderQueue(); renderPool(); }

function renderQueue() {
  const qLen = queue.length;
  const slotsPer = COLS - 1; const rows = (qLen + 1) <= slotsPer ? 1 : 1 + Math.ceil((qLen + 1 - slotsPer) / COLS);
  const prevRowCount = qGrid.querySelectorAll('.qrow').length;
  qGrid.innerHTML = '';

  const tileSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile'));
  const gap = 4;

  /* Group headers */
  qGrpHdrs.innerHTML = '';
  const spacer = document.createElement('div');
  spacer.className = 'grp-spacer';
  spacer.style.width = tileSize + 'px';
  qGrpHdrs.appendChild(spacer);
  const standLbl = document.createElement('div');
  standLbl.className = 'grp-label grp-stand';
  standLbl.style.width = (4*tileSize + 3*gap) + 'px';
  standLbl.textContent = 'Stand';
  qGrpHdrs.appendChild(standLbl);
  const gs = document.createElement('div');
  gs.style.width = gap + 'px';
  qGrpHdrs.appendChild(gs);
  const holdLbl = document.createElement('div');
  holdLbl.className = 'grp-label grp-holding';
  holdLbl.style.width = (4*tileSize + 3*gap) + 'px';
  holdLbl.textContent = 'Holding';
  qGrpHdrs.appendChild(holdLbl);

  /* Col headers */
  qColHdrs.innerHTML = '';
  qColHdrs.appendChild(Object.assign(document.createElement('div'), {className:'col-header'}));
  for (let c = 1; c < COLS; c++) {
    const ch = document.createElement('div');
    ch.className = 'col-header'; ch.textContent = c;
    qColHdrs.appendChild(ch);
  }

  /* Row labels */
  qRowLabels.innerHTML = '';
  qRowLabels.style.display = 'flex';
  for (let row = 0; row < rows; row++) {
    const rl = document.createElement('div');
    rl.className = 'row-label';
    rl.textContent = row === 0 ? '0' : row * COLS;
    qRowLabels.appendChild(rl);
  }

  /* Tiles */
  for (let row = 0; row < rows; row++) {
    const rowEl = document.createElement('div');
    rowEl.className = 'qrow';
    if (row >= prevRowCount) rowEl.classList.add('new-row');

    for (let col = 0; col < COLS; col++) {
      const tile = document.createElement('div');
      tile.className = 'tile';

      if (row === 0 && col === 0) {
        tile.classList.add('q-zero');
        tile.style.textAlign = 'center';
        tile.style.lineHeight = '1.2';
        tile.style.padding = '4px';
        if (clearState === 1) {
          tile.textContent = 'Clear all?';
          tile.style.fontSize = 'calc(var(--tile) * 0.17)';
          tile.classList.add('clear-armed');
        } else if (clearState === 2) {
          tile.textContent = 'Are you sure?';
          tile.style.fontSize = 'calc(var(--tile) * 0.15)';
          tile.classList.add('clear-confirm');
        } else if (loadedPrimed && queue.length > 0) {
          tile.textContent = 'Loaded';
          tile.style.fontSize = 'calc(var(--tile) * 0.20)';
          tile.classList.add('primed');
        } else {
          tile.textContent = 'Loading';
          tile.style.fontSize = 'calc(var(--tile) * 0.20)';
        }
        tile.dataset.role = 'zero';

        let zeroHold = null;
        const fireHold = () => { zeroHold = null; clearSelected(); clearState = 1; clearGuardUntil = Infinity; render(); };
        const releaseGuard = () => { lastTouchTime = Date.now(); if (clearGuardUntil === Infinity) clearGuardUntil = Date.now() + 600; };
        tile.addEventListener('touchstart', () => {
          lastTouchTime = Date.now();
          zeroHold = setTimeout(fireHold, HOLD_MS);
        }, { passive: true });
        tile.addEventListener('touchmove', () => {
          if (zeroHold) { clearTimeout(zeroHold); zeroHold = null; }
        }, { passive: true });
        tile.addEventListener('touchcancel', releaseGuard);
        tile.addEventListener('touchend', e => {
          e.preventDefault();
          releaseGuard();
          if (zeroHold) { clearTimeout(zeroHold); zeroHold = null; handleTap(tile); }
        });
        tile.addEventListener('mousedown', e => {
          if (e.button !== 0 || Date.now() - lastTouchTime < 500) return;
          e.preventDefault();
          zeroHold = setTimeout(fireHold, HOLD_MS);
          const onMove = () => { if (zeroHold) { clearTimeout(zeroHold); zeroHold = null; } };
          const onUp = () => {
            releaseGuard();
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            if (zeroHold) { clearTimeout(zeroHold); zeroHold = null; handleTap(tile); }
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
      } else {
        const qIdx = row === 0 ? (col-1) : ((COLS-1) + (row-1)*COLS + col);
        if (qIdx < queue.length) {
          const val = queue[qIdx];
          const isDummy = (val === 'dummy');
          if (isDummy) {
            tile.textContent = 'Filler';
            tile.style.cssText = 'background:rgba(180,180,180,.15);border:1.5px solid rgba(255,255,255,.18);color:rgba(255,255,255,.5);font-size:calc(var(--tile)*0.16);';
          } else {
            tile.textContent = val;
            tile.classList.add(qIdx < 4 ? 'q-stand' : qIdx < 8 ? 'q-hold' : 'q-overflow');
          }
          tile.dataset.role = 'queue';
          tile.dataset.qidx = qIdx;
          tile.dataset.val  = val;
          if (qIdx === selectedQIdx) tile.classList.add('selected');
          if (qIdx === replaceIdx) tile.classList.add('replace-target');
          if (loadedPrimed && qIdx === 0) tile.classList.add('load-target');
          if (qIdx === 9 || qIdx === 14 || qIdx === 19) tile.classList.add('landmark');
          attachDrag(tile, 'queue', qIdx, val);
        } else {
          tile.dataset.role = 'empty';
          tile.dataset.qidx = qIdx;
          if (qIdx === queue.length) {
            // The next available slot — show as + button
            tile.classList.add('q-add');
            tile.textContent = '+';
            tile.addEventListener('click', () => openDialpad());
            tile.addEventListener('touchend', e => { e.preventDefault(); openDialpad(); }, { passive:false });
          } else {
            tile.classList.add('q-empty');
            if (qIdx > queue.length) tile.classList.add('hidden-slot');
          }
        }
      }
      rowEl.appendChild(tile);
    }
    qGrid.appendChild(rowEl);
  }
}

function renderPool() {
  pGrid.innerHTML = '';
  pGrid.style.gridTemplateColumns = `repeat(${COLS}, var(--tile))`;
  // Dummy-front tile — always first, inserts at front of queue

  dummyFront.innerHTML = 'Filler<br>In-Front';
  dummyFront.style.cssText = 'background:rgba(180,180,180,.15);border:1.5px solid rgba(255,255,255,.18);color:rgba(255,255,255,.5);font-size:calc(var(--tile)*0.13);text-align:center;line-height:1.2;';
  dummyFront.dataset.role = 'dummy-front-src';
  dummyFront.dataset.val  = 'dummy';
  attachDrag(dummyFront, 'dummy-front-src', null, 'dummy');
  pGrid.appendChild(dummyFront);

  // Dummy tile — always second, inserts at end of queue

  dummy.textContent = 'Filler';
  dummy.style.cssText = 'background:rgba(180,180,180,.15);border:1.5px solid rgba(255,255,255,.18);color:rgba(255,255,255,.5);font-size:calc(var(--tile)*0.16);';
  dummy.dataset.role = 'dummy-src';
  dummy.dataset.val  = 'dummy';

  [...pool].sort((a,b)=>a-b).forEach(num => {

    tile.className = 'tile pool';
    tile.textContent = num;
    tile.dataset.role = 'pool';
    tile.dataset.val  = num;

  const maxTile = document.createElement('div');
  maxTile.className = 'tile';
  maxTile.style.cssText = 'background:rgba(128,216,255,.06);border:1.5px dashed rgba(128,216,255,.2);color:rgba(128,216,255,.4);font-size:calc(var(--tile)*0.13);text-align:center;line-height:1.2;padding:4px;cursor:pointer;';
  maxTile.textContent = 'adjust highest taxi number';
  maxTile.addEventListener('click', () => openMaxDialpad());
  maxTile.addEventListener('touchend', e => { e.preventDefault(); openMaxDialpad(); }, { passive: false });
  pGrid.appendChild(maxTile);
}

/* ── 10-11 REQUEST MODAL ── */
function showReq1011(num) {

/* ── STATE MUTATORS (all call saveToFirebase) ── */
function mutate(fn, action, value) {
  cancelReplace();
  pushUndo(action ? action + (value !== undefined ? ' ' + value : '') : 'change');
  fn();
  if (action && value !== undefined) logChange(action, value);
  saveToFirebase();
  render();
}

/* ── UNDO ── */
const undoBtn = document.getElementById('undo-btn');
const undoStack = [];
function syncUndoBtn() { undoBtn.disabled = !undoStack.length; }
function pushUndo(label) {
  undoStack.push({ q: queue.slice(), label });
  if (undoStack.length > 30) undoStack.shift();
  syncUndoBtn();
}
function doUndo() {
  const u = undoStack.pop(); if (!u) return;
  cancelReplace(); clearSelected();
  queue = u.q; rebuildPool(queue);
  logChange('undo', u.label);
  saveToFirebase(); syncUndoBtn(); render();
}
undoBtn.addEventListener('pointerdown', e => { e.preventDefault(); doUndo(); });

/* ── DRAG & DROP ── */
const HOLD_MS = 350;
const MOVE_PX = 10;

const dnd = {
  active: false,
  srcEl: null, val: null, source: null, srcIdx: null,
  ox: 0, oy: 0,
  startX: 0, startY: 0,
  holdTimer: null,
  canceled: false,
};

let lastTouchTime = 0; // track last touch to block synthetic mouse events on mobile

function attachDrag(el, source, idx, val) {
  // ── MOUSE (desktop) ──
  el.addEventListener('dragstart', e => e.preventDefault());
  el.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    // Block synthetic mouse events fired by browser after touch (iOS/Android)
    if (Date.now() - lastTouchTime < 500) return;
    e.preventDefault();
    const r = el.getBoundingClientRect();
    Object.assign(dnd, { srcEl:el, val, source, srcIdx:idx, canceled:false,
      ox:e.clientX-r.left, oy:e.clientY-r.top,
      startX:e.clientX, startY:e.clientY, active:false });
    document.addEventListener('mousemove', onMouseMove);
    document.addEventListener('mouseup',   onMouseUp);
  });

  // ── TOUCH (mobile) — passive so scroll is never blocked ──
  el.addEventListener('touchstart', e => {
    lastTouchTime = Date.now(); // mark that a real touch happened
    const t = e.touches[0];
    const r = el.getBoundingClientRect();
    Object.assign(dnd, { srcEl:el, val, source, srcIdx:idx, canceled:false,
      ox:t.clientX-r.left, oy:t.clientY-r.top,
      startX:t.clientX, startY:t.clientY, active:false });

    // Hold timer — fires after HOLD_MS if finger hasn't moved much
    dnd.holdTimer = setTimeout(() => {
      if (!dnd.canceled) activateDrag(dnd.startX, dnd.startY);
    }, HOLD_MS);

    el.addEventListener('touchmove',   onTouchMove,   { passive:false });
    document.addEventListener('touchend',    onTouchEnd,    { once:true });
    document.addEventListener('touchcancel', onTouchCancel, { once:true });
  }, { passive:true });
}

// ── Activate drag (show ghost etc) ──
function activateDrag(cx, cy) {
  if (dnd.canceled) return;
  if (dnd.source === 'zero') { dnd.canceled = true; return; }
  clearSelected();
  dnd.active = true;
  const el = dnd.srcEl;
  const bg  = getComputedStyle(el).backgroundColor;
  const col = getComputedStyle(el).color;
  ghostEl.style.cssText = `background:${bg};color:${col};display:flex;`;
  ghostEl.textContent = (dnd.val === 'dummy') ? 'Filler' : dnd.val;
  moveGhost(cx, cy);
  el.classList.add('dragging');
}

// ── MOUSE handlers ──
function onMouseMove(e) {
  if (!dnd.active) {
    const dx = e.clientX - dnd.startX, dy = e.clientY - dnd.startY;
    if (Math.sqrt(dx*dx+dy*dy) > MOVE_PX) activateDrag(e.clientX, e.clientY);
    else return;
  }
  moveGhost(e.clientX, e.clientY);
  updatePreview(e.clientX, e.clientY);
}

function onMouseUp(e) {
  document.removeEventListener('mousemove', onMouseMove);
  document.removeEventListener('mouseup',   onMouseUp);
  if (!dnd.active) {
    const el = dnd.srcEl;
    resetDnd();
    handleTap(el);
    return;
  }
  ghostEl.style.display = 'none';
  const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('.tile');
  const el = dnd.srcEl;
  // doDrop reads dnd state — call BEFORE resetDnd
  doDrop(target);
  finishDrag(el);
  resetDnd();
}

// ── TOUCH handlers ──
function onTouchMove(e) {
  const t = e.touches[0];
  const dx = t.clientX - dnd.startX, dy = t.clientY - dnd.startY;
  if (!dnd.active) {
    // Finger moved before hold fired — cancel drag, allow scroll
    if (Math.sqrt(dx*dx+dy*dy) > MOVE_PX) {
      clearTimeout(dnd.holdTimer);
      dnd.canceled = true;
      cancelTouchDrag();
    }
    // Don't preventDefault — let scroll happen freely
    return;
  }
  // Drag is active — prevent scroll so ghost can move
  e.preventDefault();
  moveGhost(t.clientX, t.clientY);
  updatePreview(t.clientX, t.clientY);
}

function onTouchEnd(e) {
  clearTimeout(dnd.holdTimer);
  dnd.srcEl?.removeEventListener('touchmove', onTouchMove);
  document.removeEventListener('touchcancel', onTouchCancel);
  if (!dnd.active) {
    const el = dnd.srcEl;
    const wasCanceled = dnd.canceled;
    resetDnd();
    if (!wasCanceled) handleTap(el);
    return;
  }
  const t = e.changedTouches[0];
  const cx = t.clientX, cy = t.clientY;
  // Hide ghost so elementFromPoint sees the tile underneath
  ghostEl.style.display = 'none';
  // Also temporarily hide the dragging tile so we see what's behind it
  dnd.srcEl?.style.setProperty('visibility','hidden');
  const target = document.elementFromPoint(cx, cy)?.closest('.tile');
  dnd.srcEl?.style.removeProperty('visibility');
  const el = dnd.srcEl;
  doDrop(target);
  finishDrag(el);
  resetDnd();
}

function onTouchCancel() {
  clearTimeout(dnd.holdTimer);
  cancelTouchDrag();
}

function cancelTouchDrag() {
  dnd.srcEl?.removeEventListener('touchmove',   onTouchMove);
  document.removeEventListener('touchend',    onTouchEnd);
  document.removeEventListener('touchcancel', onTouchCancel);
  finishDrag(dnd.srcEl);
  resetDnd();
}

function resetDnd() {
  dnd.active=false; dnd.srcEl=null; dnd.val=null; dnd.source=null;
  dnd.srcIdx=null; dnd.holdTimer=null; dnd.canceled=false;
}

function finishDrag(el) {
  clearPreview();
  ghostEl.style.display = 'none';
  clearDropHL();
  qGrid.querySelectorAll('.tile[data-qidx]').forEach(t => t.style.marginLeft = '');
  el?.classList.remove('dragging', 'drag-ready');
}


/* ── DIAL PAD (on-page) ── */
const tabNQ = document.getElementById('tab-nq'), tabPad = document.getElementById('tab-pad');
const padPanel = document.getElementById('pad-panel'), padDisplay = document.getElementById('pad-display');
let padValue = '', padMode = 'add', replaceIdx = -1;
const padKeyEls = {};
function cancelReplace() {
  if (replaceIdx >= 0) { replaceIdx = -1; document.querySelectorAll('.tile.replace-target').forEach(t => t.classList.remove('replace-target')); }
  if (padMode === 'replace') { padMode = 'add'; padValue = ''; padRender(); }
}
function showTab(which) {
  const pad = which === 'pad';
  tabPad.classList.toggle('active', pad); tabNQ.classList.toggle('active', !pad);
  padPanel.style.display = pad ? 'block' : 'none';
  pGrid.style.display = pad ? 'none' : '';
  if (!pad) { document.body.style.minHeight = ''; cancelReplace(); }
}
function padRender(err) {
  const rep = padMode === 'replace';
  if (padKeyEls['Add']) {
    padKeyEls['Add'].textContent = rep ? 'Replace' : 'Add';
    ['Filler In-Front','Filler','Add In-Front'].forEach(k => padKeyEls[k].classList.toggle('dim', rep));
  }
  padDisplay.classList.toggle('err', !!err);
  if (err) { padDisplay.textContent = err; return; }
  padDisplay.innerHTML = (padValue || '_') + (padMode === 'max' ? '<small>HIGHEST #</small>' : rep ? '<small>REPLACE FILLER</small>' : '');
}
function openDialpad() { cancelReplace(); padMode = 'add'; padValue = ''; padRender(); showTab('pad'); padPanel.scrollIntoView({block:'nearest', behavior:'smooth'}); }
function openMaxDialpad() { cancelReplace(); padMode = 'max'; padValue = ''; padRender(); showTab('pad'); padPanel.scrollIntoView({block:'nearest', behavior:'smooth'}); }
function padSubmit(front) {
  const raw = padValue; if (!raw) return;
  const num = parseInt(raw, 10);
  if (padMode === 'max') {
    if (isNaN(num) || num < 140) { padValue = ''; padRender(`${num} is too low — minimum is 140.`); return; }
    padValue = ''; padMode = 'add';
    MAX_NUM = num; localStorage.setItem('taxi-max-num', MAX_NUM); set(maxRef, MAX_NUM); rebuildPool(queue);
    padRender(); render(); return;
  }
  if (isNaN(num) || num < 1 || num > MAX_NUM) { padValue = ''; padRender(`${raw} is not valid (1–${MAX_NUM}).`); return; }
  if (!pool.has(num)) { padValue = ''; padRender(`Taxi ${num} is already in the queue.`); return; }
  if (padMode === 'replace') {
    const i = replaceIdx;
    if (queue[i] !== 'dummy') { cancelReplace(); padRender('That filler moved — tap it again.'); return; }
    padValue = ''; replaceIdx = -1; padMode = 'add'; clearSelected();
    mutate(() => { pool.delete(num); queue[i] = num; }, 'added', num);
    padRender(); return;
  }
  padValue = '';
  mutate(() => { pool.delete(num); front ? queue.unshift(num) : queue.push(num); }, 'added', num);
  padRender();
}
// If a key press adds a queue row, the pad shifts down — scroll by the same amount so it stays under the finger
function padKeep(fn) { keepPlace(padPanel, fn); }
function keepPlace(el, fn) {
  const before = el.getBoundingClientRect().top;
  fn();
  const d = el.getBoundingClientRect().top - before;
  if (d > 0) {
    // Page may be too short to scroll that far yet — add blank space at the bottom so it can
    const need = window.scrollY + d + window.innerHeight;
    if (document.documentElement.scrollHeight < need) document.body.style.minHeight = need + 'px';
    window.scrollBy(0, d);
  }
}
function padPress(k) {
  if (padMode === 'replace' && (k === 'Filler' || k === 'Filler In-Front' || k === 'Add In-Front')) return;
  if (k === '⌫') padValue = padValue.slice(0, -1);
    else if (k === 'Add') { padSubmit(false); return; }
    else if (k === 'Add In-Front') { padSubmit(true); return; }
    else if (k === 'Filler' || k === 'Filler In-Front') { const front = k !== 'Filler'; mutate(() => { front ? queue.unshift('dummy') : queue.push('dummy'); }, 'added', 'Filler'); return; }
    else if (padValue.length < 3) padValue += k;
    padRender();
}
['1','2','3','4','5','6','7','8','9','⌫','0','Add','Filler In-Front','Filler','Add In-Front'].forEach(k => {
  const b = document.createElement('div');
  b.className = 'pad-key' + (k === '⌫' ? ' fn' : k === 'Add' || k === 'Add In-Front' ? ' fn go' : k.startsWith('Filler') ? ' fn filler' : '');
  b.textContent = k; padKeyEls[k] = b;
  // pointerdown fires instantly for touch + mouse, so rapid taps are never swallowed by the double-tap guard
  b.addEventListener('pointerdown', e => { e.preventDefault(); padKeep(() => padPress(k)); });
  document.getElementById('pad-keys').appendChild(b);
});
// Physical keyboard: digits, Backspace, Enter = Add (Replace), Shift+Enter = Add In-Front
document.addEventListener('keydown', e => {
  if (nameModal.classList.contains('visible') || padPanel.style.display !== 'block' || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest && e.target.closest('input, textarea')) return;
  let k = null;
  if (/^[0-9]$/.test(e.key)) k = e.key;
  else if (e.key === 'Backspace') k = '⌫';
  else if (e.key === 'Enter') k = e.shiftKey ? 'Add In-Front' : 'Add';
  if (!k) return;
  e.preventDefault();
  padKeep(() => padPress(k));
});
tabNQ.addEventListener('click', () => showTab('nq'));
tabPad.addEventListener('click', () => { if (padMode === 'add') padRender(); showTab('pad'); });

/* ── SELECTED TILE (double-tap to remove) ── */
let selectedQIdx = -1; // track by queue index, not element ref (DOM rebuilds on render)

function clearSelected() {
  selectedQIdx = -1;
  loadedPrimed = false;
  clearState = 0;
  clearGuardUntil = 0;
  qGrid.querySelectorAll('.tile.selected').forEach(t => t.classList.remove('selected'));
  qGrid.querySelectorAll('.tile.load-target').forEach(t => t.classList.remove('load-target'));
  const zeroTile = document.querySelector('.tile[data-role="zero"]');
  if (zeroTile) { zeroTile.classList.remove('primed', 'clear-armed', 'clear-confirm'); zeroTile.textContent = 'Loading'; }
}

// Clear selection when tapping outside a queue or loaded tile
document.addEventListener('pointerdown', e => {
  if (e.pointerType === 'touch') return;
  if (!e.target.closest('.tile[data-role="queue"]') && !e.target.closest('.tile[data-role="zero"]')) clearSelected();
});
// Clear selection when tapping a blank area on mobile
document.addEventListener('touchend', e => {
  if (!e.target.closest('.tile[data-role="queue"]') && !e.target.closest('.tile[data-role="zero"]')) {
    setTimeout(clearSelected, 0); // defer so tile's own onTouchEnd runs first
  }
}, { passive:true });

function handleTap(el) {
  if (!el) return;
  const role=el.dataset.role, rawVal=el.dataset.val;
  const val = rawVal === 'dummy' ? 'dummy' : parseInt(rawVal);
  if (role==='zero') {
    if (clearState === 1) {
      if (Date.now() < clearGuardUntil) return; // still the same press that armed it
      clearSelected();
      pushUndo('clear all');
      queue.length = 0;
      rebuildPool(queue);
      saveToFirebase();
      render();
    } else if (loadedPrimed) {
      clearSelected();
      if (queue.length > 0) {
        const v = queue[0];
        if (v === 'dummy') mutate(() => { queue.splice(0, 1); }, 'loaded', 'Filler');
        else mutate(() => { queue.splice(0, 1); pool.add(v); }, 'loaded', v);
      }
    } else {
      if (queue.length === 0) return;
      clearSelected();
      loadedPrimed = true;
      render();
    }
  } else if (role==='dummy-src') {
    keepPlace(pGrid, () => mutate(() => { queue.push('dummy'); }, 'added', 'Filler'));
  } else if (role==='dummy-front-src') {
    keepPlace(pGrid, () => mutate(() => { queue.unshift('dummy'); }, 'added', 'Filler'));
  } else if (role==='pool') {
    keepPlace(pGrid, () => mutate(() => { pool.delete(val); queue.push(val); }, 'added', val));
  } else if (role==='queue') {
    const idx=parseInt(el.dataset.qidx);
    if (selectedQIdx === idx) {
      // Second tap — remove
      clearSelected();
      if (val === 'dummy') {
        mutate(() => { queue.splice(idx,1); }, 'removed', 'Filler');
      } else {
        mutate(() => { queue.splice(idx,1); pool.add(val); }, 'removed', val);
      }
    } else {
      // First tap — highlight
      clearSelected();
      selectedQIdx = idx;
      el.classList.add('selected');
      if (el.dataset.val === 'dummy' || el.dataset.val === 'filler') {
        // Filler: open the dial pad to replace it with a number
        cancelReplace();
        replaceIdx = idx; padMode = 'replace'; padValue = '';
        el.classList.add('replace-target');
        padRender(); showTab('pad'); padPanel.scrollIntoView({block:'nearest', behavior:'smooth'});
      } else cancelReplace();
    }
  }
}

function moveGhost(x,y) { ghostEl.style.left=(x-dnd.ox)+'px'; ghostEl.style.top=(y-dnd.oy)+'px'; }

function doDrop(target) {
  if (dnd.source === 'zero') return;
  const val=dnd.val, src=dnd.source, si=dnd.srcIdx;
  const isDummy = (val === 'dummy');

  // Use previewIdx as the canonical insertion point when set —
  // this covers the full gap zone (original tile position + shifted position)
  const ins = previewIdx >= 0 ? previewIdx : null;

  const role = target?.dataset.role;
  const ti   = parseInt(target?.dataset.qidx);

  // ── Pool / filler-src → queue ──
  if (src==='dummy-src' || src==='dummy-front-src' || src==='pool') {
    const isF = src==='dummy-src' || src==='dummy-front-src';
    const v   = isF ? 'dummy' : val;

    if (ins !== null) {
      // Dropped in the gap preview zone
      mutate(()=>{ if(!isF) pool.delete(val); queue.splice(ins,0,v); },
             'added', isF?'Filler':val);
      return;
    }
    if (role==='queue'||role==='empty') {
      const idx = isNaN(ti)||ti>queue.length ? queue.length : ti;
      mutate(()=>{ if(!isF) pool.delete(val); queue.splice(idx,0,v); },
             'added', isF?'Filler':val);
      return;
    }
    if (target?.closest('#queue-wrapper')) {
      const insertIdx = src==='dummy-front-src' ? 0 : queue.length;
      mutate(()=>{ if(!isF) pool.delete(val); queue.splice(insertIdx,0,v); },
             'added', isF?'Filler':val);
      return;
    }
    // Dropped back in pool area — do nothing (tap handles removal)
    return;
  }

  // ── Queue tile → zero/load slot ──
  if (src==='queue' && role==='zero') {
    if (isDummy) mutate(()=>{ queue.splice(si,1); }, 'loaded', 'Filler');
    else         mutate(()=>{ queue.splice(si,1); pool.add(val); }, 'loaded', val);
    return;
  }

  // ── Queue tile → reorder ──
  if (src==='queue') {
    // Use previewIdx if set, otherwise fall back to target tile index
    const dest = ins !== null ? ins : (!isNaN(ti) ? ti : null);
    if (dest !== null && dest !== si) {
      mutate(()=>{ queue.splice(si,1); queue.splice(dest>si?dest-1:dest,0,val); }, 'moved', val);
      return;
    }
    // Dropped back on pool → remove
    if (role==='pool'||role==='dummy-src'||role==='dummy-front-src') {
      if (isDummy) mutate(()=>{ queue.splice(si,1); }, 'removed', 'Filler');
      else         mutate(()=>{ queue.splice(si,1); pool.add(val); }, 'removed', val);
      return;
    }
  }
}

function clearDropHL() { document.querySelectorAll('.drop-ok').forEach(e=>e.classList.remove('drop-ok')); }

/* ── INSERT PREVIEW ── */
let previewIdx = -1; // queue index where gap is shown (-1 = none)

function updatePreview(cx, cy) {
  if (!['queue','pool','dummy-src','dummy-front-src'].includes(dnd.source)) { clearPreview(); return; }

  // Sample multiple points around the cursor to pierce through the ghost/gap
  ghostEl.style.display = 'none';
  const offsets = [[0,0],[0,-22],[0,22],[-22,0],[22,0]];
  let el = null;
  for (const [dx,dy] of offsets) {
    const hit = document.elementFromPoint(cx+dx, cy+dy)?.closest(
      '.tile[data-role="queue"],.tile[data-role="empty"]'
    );
    if (hit && hit !== dnd.srcEl) { el = hit; break; }
  }
  ghostEl.style.display = 'flex';

  // If over zero/load slot, clear
  if (el && el.dataset.role === 'zero') { clearPreview(); return; }

  if (el) {
    const ti = parseInt(el.dataset.qidx);
    if (!isNaN(ti) && ti !== previewIdx) {
      previewIdx = ti;
      applyPreview();
    }
    // same tile — hold steady
  }
  // No tile found = hovering the gap we created — hold steady, no update
}

function clearPreview() {
  if (previewIdx === -1) return;
  previewIdx = -1;
  applyPreview();
}

function applyPreview() {
  // All queue tiles: shift right if at/after previewIdx, to show a gap
  const tiles = qGrid.querySelectorAll('.tile[data-qidx]');
  tiles.forEach(t => {
    const qi = parseInt(t.dataset.qidx);
    const isSrc = (dnd.source === 'queue' && qi === dnd.srcIdx);
    if (previewIdx >= 0 && qi === previewIdx && !isSrc) {
      t.style.marginLeft = 'calc(var(--tile) + var(--gap) * 2)';
    } else {
      t.style.marginLeft = '';
    }
  });
}

/* ── DISABLE ZOOM ── */
// Block pinch-zoom
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

// Block double-tap zoom
let lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTap < 300 && !(e.target.closest && e.target.closest('input'))) e.preventDefault();
  lastTap = now;
}, { passive: false });

</script>
