<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest-stand.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2d1b69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Stand">
<title>Taxi Stand Queue</title>
<link rel="stylesheet" href="taxi-editor.css?v=5">
</head>
<body>

<button id="menu-btn" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
<div id="menu">
  <button id="zoom-btn" class="menu-item">Bigger Tiles</button>
  <button id="clear-btn" class="menu-item">Clear all</button>
  <button id="logout-btn" class="menu-item">Log out</button>
</div>

<div id="sync-status" class="ok">LIVE</div>

<section>
  <div class="qhead"><h2>Queue</h2><button id="undo-btn" disabled>↶ Undo</button></div>
  <div id="queue-wrapper">
    <div id="row-labels"></div>
    <div id="queue-cols">
      <div id="group-headers"></div>
      <div class="col-headers" id="col-headers"></div>
      <div id="queue-grid"></div>
    </div>
  </div>
</section>

<div class="divider"></div>

<section>
  <div class="tabs"><h2 id="tab-pad">Dial Pad</h2><h2 id="tab-nq" class="active">Not in Queue</h2></div>
  <div id="pool-grid"></div>
  <div id="pad-panel">
    <div id="pad-display">_</div>
    <div id="pad-keys"></div>
  </div>

</section>

<div id="req1011-modal">
  <div class="req1011-card">
    <div class="req1011-title">10-11 Request</div>
    <div class="req1011-msg" id="req1011-msg"></div>
    <div class="req1011-btns">
      <button class="req1011-btn req1011-ok"   id="req1011-ok">OK</button>
      <button class="req1011-btn req1011-undo" id="req1011-undo">Undo</button>
    </div>
  </div>
</div>

<div id="ghost"></div>

<script>window.TAXI_MODE = 'stand';</script>
<script type="module" src="taxi-editor.js?v=6"></script>
</body>
</html>
