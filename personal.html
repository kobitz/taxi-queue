<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest-personal.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2d1b69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Personal">
<title>Taxi Stand — Personal</title>
<link rel="stylesheet" href="taxi-editor.css?v=2">
</head>
<body>

<button id="zoom-btn">Bigger Tiles</button>

<div id="sync-status" class="ok">SAVED</div>

<section>
  <div class="qhead"><h2>Queue</h2><button id="undo-btn" disabled>↶ Undo</button></div>
  <div id="queue-wrapper">
    <div id="row-labels"></div>
    <div id="queue-cols">
      <div id="group-headers"></div>
      <div class="col-headers" id="col-headers"></div>
      <div id="queue-grid"></div>
    </div>
  </div>
</section>

<div class="divider"></div>

<section>
  <div class="tabs"><h2 id="tab-pad">Dial Pad</h2><h2 id="tab-nq" class="active">Not in Queue</h2></div>
  <div id="pool-grid"></div>
  <div id="pad-panel">
    <div id="pad-display">_</div>
    <div id="pad-keys"></div>
  </div>

</section>

<div id="num-modal">
  <div class="num-card">
    <div class="num-title">Your taxi number</div>
    <div class="num-sub">Your tile is highlighted in the queue</div>
    <div id="num-display">_</div>
    <div id="num-err"></div>
    <div id="num-keys"></div>
    <div class="num-btns">
      <button class="num-btn num-skip" id="num-skip">Skip</button>
    </div>
  </div>
</div>

<div id="ghost"></div>

<script>window.TAXI_MODE = 'personal';</script>
<script type="module" src="taxi-editor.js?v=2"></script>
</body>
</html>
