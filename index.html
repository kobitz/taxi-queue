<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest-index.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#2d1b69">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Live">
<title>Taxi Stand Queue — View</title>
<style>
  :root {
    --bg: #2d1b69;
    --stand: #1565c0;
    --holding: #6a1b9a;
    --highlight: #80d8ff;
    --overflow: rgba(128,216,255,.12);
    --empty: rgba(255,255,255,0.07);
    --tile: 60px;
    --gap: 4px;
    --r: 6px;
    --label-w: 26px;
    --pad: 10px;
    --grphdr-h: 18px;
    --colhdr-h: 20px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { overflow-x: hidden; max-width: 100vw; touch-action: manipulation; }
  body { background: var(--bg); min-height: 100dvh; font-family: 'Segoe UI', system-ui, sans-serif; color: #fff; padding: var(--pad); }

  h2 { font-size: 11px; font-weight: 700; letter-spacing: 2.5px; text-transform: uppercase; color: var(--highlight); margin-bottom: 8px; opacity: 0.75; }

  #sync-status {
    position: fixed; top: 16px; right: 60px;
    font-size: 10px; font-weight: 700; letter-spacing: 1px;
    padding: 3px 8px; border-radius: 20px;
    opacity: 0.85; pointer-events: none; z-index: 100;
    transition: background .3s;
  }
  #sync-status.ok    { background: rgba(0,200,100,.25); color: #69ffb0; }
  .tile.my-tile { background: #80d8ff !important; color: #1e1248 !important; box-shadow: 0 0 0 1.5px rgba(255,255,255,.55), 0 4px 14px rgba(128,216,255,.45) !important; filter: none !important; }
  #sync-status.error { background: rgba(255,80,80,.25);  color: #ff8080; }
  #updated { font-size: 11px; opacity: .65; margin: -2px 0 8px; min-height: 14px; }
  #updated.stale { color: #ffab40; opacity: .95; }

  /* QUEUE LAYOUT */
  #queue-wrapper { display: flex; flex-direction: row; gap: var(--gap); }
  #row-labels {
    display: flex; flex-direction: column; gap: var(--gap);
    margin-top: calc(var(--grphdr-h) + var(--gap) + var(--colhdr-h) + var(--gap));
    flex-shrink: 0;
  }
  .row-label {
    width: var(--label-w); height: var(--tile);
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 4px; font-size: 10px; font-weight: 700;
    color: rgba(128,216,255,.6); letter-spacing: .5px; flex-shrink: 0;
  }
  #queue-cols { display: flex; flex-direction: column; gap: var(--gap); min-width: 0; }
  #group-headers { display: flex; flex-direction: row; gap: var(--gap); height: var(--grphdr-h); }
  .grp-spacer { flex-shrink: 0; }
  .grp-label {
    height: var(--grphdr-h);
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 800; letter-spacing: 1.5px;
    text-transform: uppercase; border-radius: 3px; flex-shrink: 0;
  }
  .grp-stand   { background: rgba(21,101,192,.35); color: #80d8ff; }
  .grp-holding { background: rgba(106,27,154,.35); color: #ce93d8; }
  .col-headers { display: flex; flex-direction: row; gap: var(--gap); height: var(--colhdr-h); }
  .col-header {
    width: var(--tile); height: var(--colhdr-h);
    display: flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 700; color: rgba(128,216,255,.55);
    letter-spacing: .5px; flex-shrink: 0;
  }
  #queue-grid { display: flex; flex-direction: column; gap: var(--gap); }
  .qrow { display: flex; flex-direction: row; gap: var(--gap); }
  .qrow.new-row { animation: rowIn .22s cubic-bezier(.34,1.56,.64,1); }
  @keyframes rowIn { from { opacity:0; transform:translateY(-10px) scale(.96); } to { opacity:1; transform:none; } }

  /* TILE — no cursor:grab, no drag styles */
  .tile {
    width: var(--tile); height: var(--tile);
    border-radius: var(--r);
    display: flex; align-items: center; justify-content: center;
    font-size: calc(var(--tile) * 0.28); font-weight: 700;
    position: relative;
    flex-shrink: 0; cursor: default;
  }
  .q-zero     { background: rgba(180,180,180,.15); border: 1.5px solid rgba(255,255,255,.18); color: rgba(255,255,255,.5); }
  .q-stand    { background: var(--stand);    box-shadow: 0 4px 14px rgba(21,101,192,.45); }
  .q-hold     { background: var(--holding);  box-shadow: 0 4px 14px rgba(106,27,154,.45); }
  .q-overflow { background: var(--overflow); border: 1.5px solid rgba(128,216,255,.22); color: rgba(255,255,255,.85); }
  .q-empty    { background: var(--empty); border: 1.5px dashed rgba(255,255,255,.13); }
  .tile.landmark { filter: brightness(1.5) saturate(1.4); background: rgba(128,216,255,.20); }
  .q-empty.hidden-slot { visibility: hidden; }
  .q-zero.req-armed   { box-shadow: 0 0 0 2px #ffd600; color: #ffd600; }
  .q-zero.req-confirm { box-shadow: 0 0 0 2px #ff5555; color: #ff5555; }

  /* settings menu (gear) */
  #menu-btn { position:fixed; top:6px; right:6px; width:44px; height:44px; padding:0; display:flex; align-items:center; justify-content:center;
    background:none; color:#80d8ff; border:none; border-radius:12px; cursor:pointer; z-index:160; }
  #menu-btn svg { width:26px; height:26px; }
  #menu-btn.open { color:#fff; }
  #menu { display:none; position:fixed; top:56px; right:6px; min-width:190px; z-index:160; background:#1e1248; border:1.5px solid rgba(128,216,255,.45); border-radius:12px; padding:6px; box-shadow:0 10px 30px rgba(0,0,0,.6); }
  #menu.open { display:block; }
  .menu-item { display:block; width:100%; min-height:44px; padding:10px 14px; text-align:left; background:none; border:none; border-radius:8px; color:#fff; font-size:15px; font-weight:600; cursor:pointer; }
  .menu-item:active { background:rgba(128,216,255,.25); }

  /* light mode (gear menu → Light Mode; the number box stays dark) */
  html.light { --bg:#f1f4fb; --highlight:#1565c0; --overflow:rgba(21,101,192,.12); --empty:rgba(20,30,80,.06); }
  html.light body { color:#1a1a3a; }
  html.light .row-label { color:rgba(21,101,192,.8); }
  html.light .col-header { color:rgba(21,101,192,.75); }
  html.light .grp-stand   { background:rgba(21,101,192,.18); color:#0d47a1; }
  html.light .grp-holding { background:rgba(106,27,154,.16); color:#6a1b9a; }
  html.light .q-overflow { border-color:rgba(21,101,192,.3); color:#1a1a3a; }
  html.light .q-empty { border-color:rgba(20,30,80,.18); }
  html.light .q-zero { background:rgba(20,30,80,.08); border-color:rgba(20,30,80,.22); color:rgba(20,30,80,.6); }
  html.light .q-stand, html.light .q-hold { color:#fff; }
  html.light .tile[style*="180, 180, 180"] { background:rgba(20,30,80,.07) !important; border-color:rgba(20,30,80,.22) !important; color:rgba(20,30,80,.65) !important; }
  html.light #sync-status.ok { background:rgba(0,150,80,.18); color:#0b7a3e; }
  html.light #sync-status.error { background:rgba(220,50,50,.15); color:#c62828; }
  html.light #updated.stale { color:#c25e00; }
  html.light #menu-btn { color:#1565c0; }
  html.light #menu-btn.open { color:#0d47a1; }
  html.light #menu { background:#fff; border-color:rgba(21,101,192,.45); box-shadow:0 10px 30px rgba(20,30,80,.25); }
  html.light .menu-item { color:#1a1a3a; }
  html.light .menu-item:active { background:rgba(21,101,192,.15); }

  /* taxi-number modal — uses the phone's numeric keypad */
  #num-modal { display:none; position:fixed; inset:0; z-index:300; background:rgba(0,0,0,.7); align-items:center; justify-content:center; }
  #num-modal.visible { display:flex; }
  .num-card { background:#1e1248; border:1.5px solid rgba(128,216,255,.45); border-radius:16px; padding:24px; width:min(90%,320px); text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.6); }
  .num-title { font-size:11px; font-weight:800; letter-spacing:2px; text-transform:uppercase; color:#80d8ff; margin-bottom:6px; }
  .num-sub { font-size:13px; opacity:.7; margin-bottom:14px; }
  .caret { display:inline-block; width:2px; height:.95em; margin-left:2px; vertical-align:-.1em; background:currentColor; }
  #num-display { height:56px; border-radius:10px; border:1.5px solid rgba(128,216,255,.4); background:rgba(255,255,255,.08); display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:700; letter-spacing:2px; }
  #num-keys { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; }
  .num-key { height:54px; border-radius:10px; background:rgba(128,216,255,.12); border:1.5px solid rgba(128,216,255,.22); color:#fff; font-size:22px; font-weight:700; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .num-key:active { background:rgba(128,216,255,.35); }
  .num-key.fn { font-size:16px; color:#80d8ff; }
  .num-key.go { background:#80d8ff; color:#1e1248; border-color:transparent; }
  #num-err { min-height:18px; margin-top:8px; font-size:13px; color:#ff8080; }
  .num-btns { display:flex; gap:10px; margin-top:6px; justify-content:center; }
  .num-btn { padding:11px 26px; border-radius:10px; font-size:14px; font-weight:700; border:none; cursor:pointer; }
  .num-save { background:#80d8ff; color:#1e1248; }
  .num-skip { background:rgba(255,255,255,.1); color:rgba(255,255,255,.7); border:1.5px solid rgba(255,255,255,.2); }
</style>
<script>try{if(localStorage.getItem('taxi-theme')==='light'){document.documentElement.classList.add('light');document.querySelector('meta[name="theme-color"]').content='#f1f4fb';document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]').content='default'}}catch(e){}</script>
</head>
<body>

<button id="menu-btn" aria-label="Settings"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
<div id="menu">
  <button id="zoom-btn" class="menu-item">Bigger Tiles</button>
  <button id="theme-btn" class="menu-item">Light Mode</button>
</div>

<div id="sync-status" class="ok">LIVE</div>

<section>
  <h2>Queue</h2>
  <div id="updated"></div>
  <div id="queue-wrapper">
    <div id="row-labels"></div>
    <div id="queue-cols">
      <div id="group-headers"></div>
      <div class="col-headers" id="col-headers"></div>
      <div id="queue-grid"></div>
    </div>
  </div>
</section>


<div id="num-modal">
  <div class="num-card">
    <div class="num-title">Your taxi number</div>
    <div class="num-sub">Your tile is highlighted in the queue</div>
    <div id="num-display">_</div>
    <div id="num-err"></div>
    <div id="num-keys"></div>
    <div class="num-btns">
      <button class="num-btn num-skip" id="num-skip">Skip</button>
    </div>
  </div>
</div>

<script type="module">
import { tick } from './taxi-sound.js?v=1';
const { SDK, FIREBASE_CONFIG } = await import('./taxi-config.js');   // Firebase on GitHub Pages, or the home-PC server
const { initializeApp } = await import(SDK.app);
const { getDatabase, ref, onValue, set, goOffline, goOnline } = await import(SDK.db);

const app = initializeApp(FIREBASE_CONFIG);
const db       = getDatabase(app);
const queueRef = ref(db, 'queue');
const maxRef          = ref(db, 'maxNum');
const request1011Ref  = ref(db, 'request1011');

const syncEl = document.getElementById('sync-status');
const updatedEl = document.getElementById('updated');
let updatedAt = null, serverOffset = 0, connected = true;

/* ── SIZING ── */
let COLS = parseInt(localStorage.getItem('taxi-cols') || '10');

function calcTileSize() {
  const pad = 10*2;
  const labelW = 30;
  const gaps = (COLS-1)*4;
  const size = Math.floor((document.documentElement.clientWidth - pad - labelW - gaps) / COLS);
  document.documentElement.style.setProperty('--tile', size + 'px');
}
calcTileSize();
// iOS reports the old width at the moment of rotation, so re-measure again shortly after
function relayout() { calcTileSize(); render(); }
function relayoutSoon() { relayout(); setTimeout(relayout, 120); setTimeout(relayout, 450); }
window.addEventListener('resize', relayoutSoon);
window.addEventListener('orientationchange', relayoutSoon);
if (window.visualViewport) window.visualViewport.addEventListener('resize', relayoutSoon);

const zoomBtn = document.getElementById('zoom-btn');
// Sync button label to saved state on load
zoomBtn.textContent = COLS === 5 ? 'Smaller Tiles' : 'Bigger Tiles';
zoomBtn.classList.toggle('active', COLS === 5);

zoomBtn.addEventListener('click', () => {
  COLS = COLS === 10 ? 5 : 10;
  localStorage.setItem('taxi-cols', COLS);
  zoomBtn.textContent = COLS === 5 ? 'Smaller Tiles' : 'Bigger Tiles';
  zoomBtn.classList.toggle('active', COLS === 5);
  calcTileSize();
  render();
  closeMenu();
});

/* ── SETTINGS MENU (gear, top right) ── */
const menuBtn = document.getElementById('menu-btn'), menuEl = document.getElementById('menu'), themeBtn = document.getElementById('theme-btn');
function closeMenu() { menuEl.classList.remove('open'); menuBtn.classList.remove('open'); }
menuBtn.addEventListener('click', () => { menuBtn.classList.toggle('open', menuEl.classList.toggle('open')); });
document.addEventListener('pointerdown', e => {
  if (menuEl.classList.contains('open') && !e.target.closest('#menu') && !e.target.closest('#menu-btn')) closeMenu();
}, true);
function applyTheme(light) {
  document.documentElement.classList.toggle('light', light);
  themeBtn.textContent = light ? 'Dark Mode' : 'Light Mode';
  const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = light ? '#f1f4fb' : '#2d1b69';
  const sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]'); if (sb) sb.content = light ? 'default' : 'black';
}
applyTheme(document.documentElement.classList.contains('light'));
themeBtn.addEventListener('click', () => {
  const light = !document.documentElement.classList.contains('light');
  applyTheme(light);
  try { localStorage.setItem('taxi-theme', light ? 'light' : 'dark'); } catch (e) {}
  closeMenu();
});

/* ── MY NUMBER ── */
let myNumber = parseInt(localStorage.getItem('taxi-my-number') || '0') || null;

/* ── STATE ── */
let MAX_NUM = 140;
let queue = [];
let reqState = 0;
let reqHold  = null;
const HOLD_MS = 350;
let lastTouchTime = 0;


// Ask on first load

/* ── TAXI NUMBER BOX (in-page dial pad; window.prompt blocks first paint and has no keypad in installed iPhone apps) ── */
const numModal = document.getElementById('num-modal');
const numDisplay = document.getElementById('num-display');
const numErr   = document.getElementById('num-err');
let numValue = '';
function numRender() { numDisplay.innerHTML = numValue + '<span class="caret"></span>'; }
function showNumberModal() {
  numValue = ''; numErr.textContent = ''; numRender();
  numModal.classList.add('visible');
}
function ensureMyNumber() { if (!myNumber) showNumberModal(); }
function saveMyNumber() {
  const num = parseInt(numValue, 10);
  if (isNaN(num) || num < 1 || num > MAX_NUM) { numValue = ''; numRender(); numErr.textContent = `Enter a number from 1 to ${MAX_NUM}.`; return; }
  myNumber = num;
  localStorage.setItem('taxi-my-number', num);
  numModal.classList.remove('visible');
  render();
}
function numPress(k) {
  numErr.textContent = '';
  if (k === '⌫') numValue = numValue.slice(0, -1);
  else if (k === 'Save') { saveMyNumber(); return; }
  else if (numValue.length < 3) numValue += k;
  numRender();
}
// pointerdown, not click: the page's double-tap-zoom guard can swallow a click that follows a recent tap
['1','2','3','4','5','6','7','8','9','⌫','0','Save'].forEach(k => {
  const b = document.createElement('div');
  b.className = 'num-key' + (k === '⌫' ? ' fn' : k === 'Save' ? ' fn go' : '');
  b.textContent = k;
  b.addEventListener('pointerdown', e => { e.preventDefault(); tick(); numPress(k); });
  document.getElementById('num-keys').appendChild(b);
});
document.getElementById('num-skip').addEventListener('pointerdown', e => { e.preventDefault(); numModal.classList.remove('visible'); });
// physical keyboard (desktop)
document.addEventListener('keydown', e => {
  if (!numModal.classList.contains('visible') || e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[0-9]$/.test(e.key)) numPress(e.key);
  else if (e.key === 'Backspace') numPress('⌫');
  else if (e.key === 'Enter') numPress('Save');
  else return;
  e.preventDefault();
});

setTimeout(ensureMyNumber, 0); // after first paint

/* ── LIVE LISTENER (read only) ── */
onValue(queueRef, snapshot => {
  const data = snapshot.val();
  queue = Array.isArray(data) ? data : (data ? Object.values(data) : []);
  render();
  setConn();
}, () => {
  connected = false; setConn(); renderUpdated();
});

/* ── CONNECTION + "LAST UPDATED" ── */
function setConn() {
  syncEl.className = connected ? 'ok' : 'error';
  syncEl.textContent = connected ? 'LIVE' : 'OFFLINE';
}
function renderUpdated() {
  if (!connected) { updatedEl.textContent = 'Not connected — queue may be out of date'; updatedEl.className = 'stale'; return; }
  if (!updatedAt) { updatedEl.textContent = ''; updatedEl.className = ''; return; }
  const mins = Math.max(0, Math.floor((Date.now() + serverOffset - updatedAt) / 60000));
  let t = mins < 1 ? 'Updated just now' : mins < 60 ? `Updated ${mins} min ago` : `Updated ${Math.floor(mins / 60)} h ${mins % 60} min ago`;
  const stale = mins >= 15;
  if (stale) t += ' · may be out of date';
  updatedEl.textContent = t;
  updatedEl.className = stale ? 'stale' : '';
}
onValue(ref(db, '.info/serverTimeOffset'), s => { serverOffset = s.val() || 0; renderUpdated(); });
onValue(ref(db, 'updatedAt'), s => { updatedAt = s.val(); renderUpdated(); });
onValue(ref(db, '.info/connected'), s => { connected = !!s.val(); setConn(); renderUpdated(); });
setInterval(renderUpdated, 15000);

/* Free Firebase allows 100 open connections at once. Drop ours while the app is in the background
   (after 20 s, so quick app switches don't reconnect) and reconnect when it is opened again. */
let idleTimer = null, offlineByUs = false;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    idleTimer = setTimeout(() => { offlineByUs = true; goOffline(db); }, 20000);
  } else {
    clearTimeout(idleTimer);
    if (offlineByUs) { offlineByUs = false; goOnline(db); }
  }
});

onValue(maxRef, snapshot => {
  const val = snapshot.val();
  if (val && typeof val === 'number' && val !== MAX_NUM) {
    MAX_NUM = val;
    render();
  }
});

/* ── DOM ── */
const qGrid      = document.getElementById('queue-grid');
const qGrpHdrs   = document.getElementById('group-headers');
const qColHdrs   = document.getElementById('col-headers');
const qRowLabels = document.getElementById('row-labels');

/* ── RENDER ── */
function render() { renderQueue(); }

function renderQueue() {
  const qLen = queue.length;
  const slotsPer = COLS - 1; const rows = qLen < slotsPer ? 1 : 1 + Math.ceil((qLen - slotsPer) / COLS);
  const prevRowCount = qGrid.querySelectorAll('.qrow').length;
  qGrid.innerHTML = '';

  const tileSize = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile'));
  const gap = 4;

  /* Group headers */
  qGrpHdrs.innerHTML = '';
  const spacer = document.createElement('div');
  spacer.className = 'grp-spacer';
  spacer.style.width = tileSize + 'px';
  qGrpHdrs.appendChild(spacer);
  const standLbl = document.createElement('div');
  standLbl.className = 'grp-label grp-stand';
  standLbl.style.width = (4*tileSize + 3*gap) + 'px';
  standLbl.textContent = 'Stand';
  qGrpHdrs.appendChild(standLbl);
  const gs = document.createElement('div');
  gs.style.width = gap + 'px';
  qGrpHdrs.appendChild(gs);
  const holdLbl = document.createElement('div');
  holdLbl.className = 'grp-label grp-holding';
  holdLbl.style.width = (4*tileSize + 3*gap) + 'px';
  holdLbl.textContent = 'Holding';
  qGrpHdrs.appendChild(holdLbl);

  /* Col headers */
  qColHdrs.innerHTML = '';
  qColHdrs.appendChild(Object.assign(document.createElement('div'), {className:'col-header'}));
  for (let c = 1; c < COLS; c++) {
    const ch = document.createElement('div');
    ch.className = 'col-header'; ch.textContent = c;
    qColHdrs.appendChild(ch);
  }

  /* Row labels */
  qRowLabels.innerHTML = '';
  qRowLabels.style.display = 'flex';
  for (let row = 0; row < rows; row++) {
    const rl = document.createElement('div');
    rl.className = 'row-label';
    rl.textContent = row === 0 ? '0' : row * COLS;
    qRowLabels.appendChild(rl);
  }

  /* Tiles */
  for (let row = 0; row < rows; row++) {
    const rowEl = document.createElement('div');
    rowEl.className = 'qrow';
    if (row >= prevRowCount) rowEl.classList.add('new-row');

    for (let col = 0; col < COLS; col++) {
      const tile = document.createElement('div');
      tile.className = 'tile';

      if (row === 0 && col === 0) {
        tile.classList.add('q-zero');
        tile.dataset.role = 'zero1011';
        tile.style.textAlign = 'center';
        tile.style.lineHeight = '1.2';
        tile.style.padding = '4px';
        if (reqState === 1) {
          tile.innerHTML = 'Request<br>10-11?';
          tile.style.fontSize = 'calc(var(--tile) * 0.14)';
          tile.classList.add('req-armed');
        } else if (reqState === 2) {
          tile.innerHTML = 'Are you<br>sure?';
          tile.style.fontSize = 'calc(var(--tile) * 0.14)';
          tile.classList.add('req-confirm');
        } else {
          tile.textContent = '10-11';
          tile.style.fontSize = 'calc(var(--tile) * 0.24)';
        }
        const fireHold = () => {
          reqHold = null;
          if (!myNumber) { showNumberModal(); return; }
          if (!queue.includes(myNumber)) { alert('Your number is not currently in the queue.'); return; }
          reqState = 1;
          render();
        };
        tile.addEventListener('touchstart', () => {
          lastTouchTime = Date.now();
          reqHold = setTimeout(fireHold, HOLD_MS);
        }, { passive: true });
        tile.addEventListener('touchmove', () => {
          if (reqHold) { clearTimeout(reqHold); reqHold = null; }
        }, { passive: true });
        tile.addEventListener('touchend', e => {
          e.preventDefault();
          if (reqHold) { clearTimeout(reqHold); reqHold = null; handleReqTap(); }
        });
        tile.addEventListener('mousedown', e => {
          if (e.button !== 0 || Date.now() - lastTouchTime < 500) return;
          e.preventDefault();
          reqHold = setTimeout(fireHold, HOLD_MS);
          const onMove = () => { if (reqHold) { clearTimeout(reqHold); reqHold = null; } };
          const onUp = () => {
            document.removeEventListener('mousemove', onMove);
            document.removeEventListener('mouseup', onUp);
            if (reqHold) { clearTimeout(reqHold); reqHold = null; handleReqTap(); }
          };
          document.addEventListener('mousemove', onMove);
          document.addEventListener('mouseup', onUp);
        });
      } else {
        const qIdx = row === 0 ? (col-1) : ((COLS-1) + (row-1)*COLS + col);
        if (qIdx < queue.length) {
          const val = queue[qIdx];
          const isFiller = (val === 'filler' || val === 'dummy');
          if (isFiller) {
            tile.textContent = 'Filler';
            tile.style.cssText = 'background:rgba(180,180,180,.15);border:1.5px solid rgba(255,255,255,.18);color:rgba(255,255,255,.5);font-size:calc(var(--tile)*0.16);';
          } else {
            tile.textContent = val;
            tile.classList.add(qIdx < 4 ? 'q-stand' : qIdx < 8 ? 'q-hold' : 'q-overflow');
            if (val === myNumber) tile.classList.add('my-tile');
            if (qIdx === 9 || qIdx === 14 || qIdx === 19) tile.classList.add('landmark');
          }
        } else {
          tile.classList.add('q-empty');
          if (qIdx > queue.length) tile.classList.add('hidden-slot');
        }
      }
      rowEl.appendChild(tile);
    }
    qGrid.appendChild(rowEl);
  }
}


/* ── 10-11 REQUEST ── */
function handleReqTap() {
  if (reqState === 0) return;
  if (reqState === 1) { reqState = 2; render(); }
  else if (reqState === 2) {
    if (!myNumber || !queue.includes(myNumber)) { reqState = 0; render(); return; }
    set(request1011Ref, { number: myNumber, ts: Date.now() });
    reqState = 0;
    render();
  }
}

document.addEventListener('pointerdown', e => {
  if (reqState === 0) return;
  if (e.target.closest('[data-role="zero1011"]')) return;
  reqState = 0;
  if (reqHold) { clearTimeout(reqHold); reqHold = null; }
  render();
});

/* ── DISABLE ZOOM ── */
// Block pinch-zoom
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

// Block double-tap zoom
let lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTap < 300) e.preventDefault();
  lastTap = now;
}, { passive: false });

</script>
